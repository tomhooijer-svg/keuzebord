<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuzebord — beheer</title>
<link rel="stylesheet" href="src/kb-stijl.css">
<style>
.app{ display: flex; min-height: 100vh; }

/* ── zijbalk ──────────────────────────────────────────── */
.zijbalk{
  width: 232px; flex: none; background: var(--vlak);
  border-right: 1px solid var(--lijn);
  padding: 22px 14px; display: flex; flex-direction: column; gap: 22px;
  position: sticky; top: 0; height: 100vh;
}
.zij-kop{ padding: 0 10px; }
.zij-kop .n{ font-size: 1.05rem; font-weight: 600; letter-spacing: -.015em; }
.zij-kop .s{ font-size: .82rem; color: var(--inkt-4); }
.zij-menu{ display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.zij-knop{
  display: flex; align-items: center; gap: 11px; padding: 9px 12px;
  border-radius: var(--rond-s); font-size: .9rem; font-weight: 500;
  color: var(--inkt-2); text-align: left; width: 100%;
  transition: background .15s ease, color .15s ease;
}
.zij-knop:hover{ background: var(--vlak-2); color: var(--inkt); }
.zij-knop.aan{ background: var(--accent); color: #fff; font-weight: 600; }
.zij-knop svg{ flex: none; }
.zij-onder{ margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.zij-link{
  display: flex; align-items: center; gap: 10px; padding: 10px;
  border-radius: var(--rond-s); background: var(--vlak-2);
  font-size: .85rem; font-weight: 600; color: var(--inkt-2); text-decoration: none;
}

/* ── inhoud ───────────────────────────────────────────── */
.inhoud{ flex-grow: 1; padding: 26px 30px 60px; min-width: 0; }
.kopregel{ display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.titel{ font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
.ondertitel{ font-size: .92rem; color: var(--inkt-3); margin-top: 3px; }

.paneel{ background: var(--vlak); border-radius: var(--rond-m); box-shadow: var(--schaduw-1); padding: 20px 22px; }
.paneel + .paneel{ margin-top: 18px; }
.paneelkop{ font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--inkt-3); margin-bottom: 12px; }
.rooster2{ display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }

.rij{ display: flex; align-items: center; gap: 14px; padding: 11px 2px; border-bottom: 1px solid var(--vlak-2); }
.rij:last-child{ border-bottom: none; }
.rij-naam{ font-weight: 600; font-size: .95rem; }
.rij-sub{ font-size: .82rem; color: var(--inkt-3); }
.rij-acties{ margin-left: auto; display: flex; gap: 6px; flex: none; }

.schakel{
  width: 50px; height: 30px; border-radius: var(--rond-vol); background: rgba(20,28,44,.14);
  padding: 3px; display: flex; justify-content: flex-start; flex: none;
  transition: background .2s ease;
}
.schakel .knopje{ width: 24px; height: 24px; border-radius: 50%; background: #fff;
                  box-shadow: 0 1px 3px rgba(20,28,44,.22); transition: transform .22s var(--veer); }
.schakel.aan{ background: var(--accent); }
.schakel.aan .knopje{ transform: translateX(20px); }

.veld{ display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.veld label{ font-size: .8rem; font-weight: 600; color: var(--inkt-2); }
.veld input[type=text], .veld input[type=number], .veld select{
  border: 1.5px solid var(--lijn); border-radius: var(--rond-s);
  padding: 9px 12px; font-size: .92rem; background: var(--vlak); width: 100%;
}
.teller{ display: flex; align-items: center; gap: 12px; }
.teller button{ width: 34px; height: 34px; border-radius: 50%; background: var(--vlak-2); font-size: 1.1rem; font-weight: 600; }
.teller .w{ min-width: 42px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

.chips{ display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip{ font-size: .82rem; font-weight: 600; padding: 7px 14px; border-radius: var(--rond-vol);
       background: var(--vlak-2); color: var(--inkt-2); }
.chip.aan{ background: var(--accent); color: #fff; }

.doelrij{ display: flex; gap: 10px; align-items: flex-start; padding: 8px 11px; border-radius: var(--rond-s);
          cursor: pointer; font-size: .87rem; line-height: 1.45; border: 1.5px solid transparent; }
.doelrij:hover{ background: var(--vlak-2); }
.doelrij.aan{ background: var(--accent-zacht); border-color: #c9d9fb; }
.doelrij input{ margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.doelrij .aspect{ font-weight: 700; color: var(--inkt-3); font-size: .78rem; letter-spacing: .03em; }

.leerlingrooster{ display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; }
.leerlingkaart{ display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px;
                border-radius: var(--rond-m); transition: background .15s ease; }
.leerlingkaart:hover{ background: var(--vlak-2); }
.leerlingkaart .picto-rond{ width: 54px; height: 54px; font-size: 1.25rem; }

.hint{ font-size: .86rem; color: var(--inkt-3); line-height: 1.55; }
.uploadvak{ display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

@media (max-width: 820px){
  .app{ flex-direction: column; }
  .zijbalk{ width: 100%; height: auto; position: static; flex-direction: row; overflow-x: auto;
            border-right: none; border-bottom: 1px solid var(--lijn); gap: 12px; align-items: center; }
  .zij-kop, .zij-onder{ display: none; }
  .zij-menu{ flex-direction: row; }
  .zij-knop{ white-space: nowrap; }
  .inhoud{ padding: 20px 16px 50px; }
}
</style>
</head>
<body class="beheer">

<div class="app">
  <nav class="zijbalk">
    <div class="zij-kop">
      <div class="n" id="zij-groep">—</div>
      <div class="s">Beheer</div>
    </div>
    <div class="zij-menu" id="zij-menu"></div>
    <div class="zij-onder">
      <a class="zij-link" href="bord.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 l-7 7 7 7"></path></svg>
        Terug naar het bord
      </a>
    </div>
  </nav>
  <main class="inhoud" id="inhoud"></main>
</div>

<div class="overlay" id="overlay"><div class="blad" id="blad"></div></div>
<div class="melding" id="melding"></div>

<script src="src/kb-data.js"></script>
<script src="src/kb-beheer.js"></script>
</body>
</html>
