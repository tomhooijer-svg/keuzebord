// DOELEN
// De catalogus (480 doelen uit de leer- en ontwikkelingslijnen jonge kind)
// staat los van G, onder een eigen sleutel. Zo blijft hij buiten elke save()
// van de klasgegevens en telt hij niet mee voor de opslaglimiet daarvan.
// Per klas bewaren we alleen welke doelen aanstaan, plus het niveaubereik.
// ══════════════════════════════════════════════════════════
var DOELEN_KEY='kb_doelen';
var DOELEN={meta:null, lijst:[]};

// Welke beheersingsniveaus horen standaard bij welke groep.
// Halfjaarniveaus (1a/1b) dragen spel, taal en rekenen; de hele-jaarniveaus
// (0/1/2/3) dragen motoriek en sociaal-emotioneel.
var NIVEAUS_PER_GROEP={
  1:['0','1a','1b','1'],
  2:['2a','2b','2'],
  3:['3a','3b','3']
};

function doelenLaad(){
  try{
    var s=localStorage.getItem(DOELEN_KEY);
    if(s){var p=JSON.parse(s);DOELEN.meta=p.meta||null;DOELEN.lijst=p.lijst||[];}
  }catch(e){DOELEN={meta:null,lijst:[]};}
}
function doelenBewaar(){
  try{localStorage.setItem(DOELEN_KEY,JSON.stringify(DOELEN));return true;}
  catch(e){toast('Doelen passen niet in de opslag van deze browser');return false;}
}

function doelenNeemOver(pak){
  if(!pak||pak.formaat!=='keuzebord-doelen'||!Array.isArray(pak.doelen)){
    toast('Dit is geen doelenbestand');return false;
  }
  DOELEN.meta={bron:pak.bron||'',versie:pak.versie||1,niveaus:pak.niveaus||[],domeinen:pak.domeinen||[]};
  DOELEN.lijst=pak.doelen;
  if(!doelenBewaar()) return false;
  toast(DOELEN.lijst.length+' doelen ingeladen');
  renderDoelenPanel();
  return true;
}

function doelenHaalOp(){
  // Zit de lijst in de pagina zelf (voorvertoning, of los geopend bestand),
  // dan gebruiken we die. Anders halen we hem op van naast de app.
  var ingebouwd=document.getElementById('doelen-ingebouwd');
  if(ingebouwd){
    try{doelenNeemOver(JSON.parse(ingebouwd.textContent));return;}
    catch(e){/* dan alsnog ophalen */}
  }
  fetch('data/doelen-gouwe-academie.json')
    .then(function(r){if(!r.ok) throw new Error(r.status);return r.json();})
    .then(doelenNeemOver)
    .catch(function(){toast('Kon de lijst niet ophalen — kies het bestand zelf');});
}
function doelenImporteerBestand(input){
  var f=input.files&&input.files[0];input.value='';
  if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    var pak;try{pak=JSON.parse(e.target.result);}catch(err){toast('Onleesbaar bestand');return;}
    doelenNeemOver(pak);
  };
  r.readAsText(f);
}

function klasNiveaus(k){
  k=k||getKlas();
  if(Array.isArray(k.doelNiveaus)&&k.doelNiveaus.length) return k.doelNiveaus;
  var m=(k.naam||'').match(/\b([123])\b/);        // "Groep 2C" -> 2
  return NIVEAUS_PER_GROEP[m?m[1]:2]||NIVEAUS_PER_GROEP[2];
}
function doelActief(k,id){return !!(k.doelActief&&k.doelActief[id]);}
function telActieveDoelen(k){k=k||getKlas();return Object.keys(k.doelActief||{}).length;}

function zetDoel(id,aan){
  var k=getKlas();
  if(!k.doelActief) k.doelActief={};
  if(aan) k.doelActief[id]=true; else delete k.doelActief[id];
  save();
  var el=document.getElementById('doel-teller');
  if(el) el.textContent=telActieveDoelen(k);
  var rij=document.getElementById('doelrij-'+id);
  if(rij) rij.classList.toggle('doel-aan',aan);
}

function zetHeleLeerlijn(niveau,leerlijn,aan){
  var k=getKlas();
  if(!k.doelActief) k.doelActief={};
  DOELEN.lijst.forEach(function(d){
    if(d.niveau===niveau&&d.leerlijn===leerlijn){
      if(aan) k.doelActief[d.id]=true; else delete k.doelActief[d.id];
    }
  });
  save();renderDoelenPanel();
}

var _doelNiveau=null, _doelZoek='';
function doelenKiesNiveau(n){_doelNiveau=n;renderDoelenPanel();}
function doelenZoek(v){_doelZoek=(v||'').toLowerCase();renderDoelenPanel();}

function renderDoelenPanel(){
  var p=document.getElementById('panel-doelen');
  if(!p) return;
  var k=getKlas();
  var niveaus=klasNiveaus(k);
  if(!_doelNiveau||niveaus.indexOf(_doelNiveau)<0) _doelNiveau=niveaus[0];

  if(!DOELEN.lijst.length){
    p.innerHTML='<div class="stitle">Doelen</div>'+
      '<p class="hint" style="margin-bottom:14px">Er is nog geen doelenlijst ingeladen. '+
      'De lijst hoort bij de app en bevat de leer- en ontwikkelingslijnen jonge kind, geordend per beheersingsniveau.</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-primary btn-sm" onclick="doelenHaalOp()">Doelenlijst inladen</button>'+
      '<label class="btn btn-ghost btn-sm" style="margin:0;cursor:pointer">Bestand kiezen'+
      '<input type="file" accept="application/json,.json" style="display:none" onchange="doelenImporteerBestand(this)"></label>'+
      '</div>';
    return;
  }

  var zichtbaar=DOELEN.lijst.filter(function(d){
    if(d.niveau!==_doelNiveau) return false;
    if(!_doelZoek) return true;
    return ((d.aspect||'')+' '+d.doel+' '+d.leerlijn).toLowerCase().indexOf(_doelZoek)>=0;
  });

  // groeperen: domein -> leerlijn
  var boom={},volgorde=[];
  zichtbaar.forEach(function(d){
    if(!boom[d.domein]){boom[d.domein]={};volgorde.push(d.domein);}
    if(!boom[d.domein][d.leerlijn]) boom[d.domein][d.leerlijn]=[];
    boom[d.domein][d.leerlijn].push(d);
  });

  var tabs=niveaus.map(function(n){
    var telling=DOELEN.lijst.filter(function(d){return d.niveau===n;}).length;
    return '<button class="btn '+(n===_doelNiveau?'btn-primary':'btn-ghost')+' btn-sm" '+
           'onclick="doelenKiesNiveau(\''+n+'\')">'+n+' <span style="opacity:.65">'+telling+'</span></button>';
  }).join('');

  var html='<div class="stitle">Doelen – '+escHtml(k.naam)+
    '<span class="badge" id="doel-teller">'+telActieveDoelen(k)+'</span></div>'+
    '<p class="hint" style="margin-bottom:12px">Vink aan waar je dit jaar aan werkt. Alleen aangevinkte doelen '+
    'verschijnen straks bij taken en observaties. Deze groep werkt op niveau '+niveaus.join(', ')+'.</p>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+tabs+'</div>'+
    '<input type="text" placeholder="Zoek in doelen…" value="'+escHtml(_doelZoek)+'" oninput="doelenZoek(this.value)" '+
    'style="width:100%;font-family:inherit;font-size:.85rem;border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;margin-bottom:14px">';

  if(!zichtbaar.length){
    html+='<p class="hint">Geen doelen gevonden.</p>';
    p.innerHTML=html;return;
  }

  volgorde.forEach(function(dom){
    html+='<div style="font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;'+
          'color:var(--sub);margin:18px 0 8px">'+escHtml(dom)+'</div>';
    Object.keys(boom[dom]).forEach(function(ll){
      var rij=boom[dom][ll];
      var allesAan=rij.every(function(d){return doelActief(k,d.id);});
      html+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px">'+
            '<div style="font-size:.85rem;font-weight:600;color:var(--text)">'+escHtml(ll)+'</div>'+
            '<button class="btn btn-ghost btn-sm" onclick="zetHeleLeerlijn(\''+_doelNiveau+'\',\''+
            ll.replace(/'/g,"\\'")+'\','+(!allesAan)+')">'+(allesAan?'Alles uit':'Alles aan')+'</button></div>';
      rij.forEach(function(d){
        var aan=doelActief(k,d.id);
        html+='<label id="doelrij-'+d.id+'" class="doelrij'+(aan?' doel-aan':'')+'">'+
              '<input type="checkbox" '+(aan?'checked':'')+' onchange="zetDoel(\''+d.id+'\',this.checked)">'+
              '<span>'+(d.aspect?'<b>'+escHtml(d.aspect)+':</b> ':'')+escHtml(d.doel)+
              (d.ster?' <span class="doel-ster" title="Stond in het bronbestand met een sterretje">*</span>':'')+
              '</span></label>';
      });
    });
  });
  p.innerHTML=html;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function saveGroepje(idx){
  var naam=document.getElementById('groepje-naam').value.trim();
  if(!naam){toast('Naam vereist');return;}
  var k=getKlas();
  if(!k.groepjes) k.groepjes=[];
  var ids=k.leerlingen.filter(function(l){

function doAutoGroepjes(){
  var k=getKlas();
  if(!k.groepjes) k.groepjes=[];
  var n=parseInt(document.getElementById('ag-n')?.textContent||4);
  var basis=document.getElementById('ag-basis')?.value||'random';
  var leerlingen=k.leerlingen.filter(function(l){return (l.status||'aanwezig')==='aanwezig';});
  if(!leerlingen.length){toast('Geen aanwezige leerlingen');closeModal();return;}
  // Sort by werkplaats progress if requested
  if(basis==='werkplaats'){
    leerlingen=leerlingen.slice().sort(function(a,b){
      var pa=getWerkplaatsVoortgangPct(a.id);var pb=getWerkplaatsVoortgangPct(b.id);
      return pa-pb; // mix low+high by interleaving below
    });
    // Interleave: [ lowest, highest, 2nd lowest, 2nd highest, ... ]
    var sorted=leerlingen.slice();
    leerlingen=[];
    var lo=0,hi=sorted.length-1;
    while(lo<=hi){
      if(lo===hi){leerlingen.push(sorted[lo]);break;}
      leerlingen.push(sorted[lo]);leerlingen.push(sorted[hi]);
      lo++;hi--;
    }
  } else {
    // Fisher-Yates shuffle
    leerlingen=leerlingen.slice();
    for(var i=leerlingen.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=leerlingen[i];leerlingen[i]=leerlingen[j];leerlingen[j]=tmp;}
  }
  var groepNamen=['Rood','Blauw','Groen','Geel','Paars','Oranje','Roze','Wit','Zwart','Bruin'];
  var newGroepen=[];
  for(var g=0;g<n;g++){
    var ids=[];
    for(var i=g;i<leerlingen.length;i+=n) ids.push(leerlingen[i].id);
    newGroepen.push({id:'g'+uid(),naam:'Groep '+(groepNamen[g]||g+1),leerlingIds:ids,aangemaakt:Date.now()});
  }
  k.groepjes=k.groepjes.concat(newGroepen);
  save();closeModal();renderGroepjesPanel();
  toast(n+' groepjes aangemaakt ('+newGroepen.reduce(function(t,g){return t+g.leerlingIds.length;},0)+' leerlingen)');
}

var WP_DAGKLEUREN=['#e74c3c','#e67e22','#3498db','#2ecc71','#9b59b6'];

function getWerkplaatsTaken(){var k=getKlas();if(!k.werkplaatsTaken)k.werkplaatsTaken=[];return k.werkplaatsTaken;}

function getWerkplaatsVoortgangPct(leerlingId){
  var taken=getWerkplaatsTaken();
  if(!taken.length) return 0;
  var gedaan=taken.filter(function(t){
    return (t.voortgang||[]).find(function(v){return v.leerlingId===leerlingId&&v.status==='klaar';});
  }).length;
  return Math.round(gedaan/taken.length*100);
}

// WEEKPLANNER
// Activiteiten per dag roosteren, koppelen aan werkplaats
// ══════════════════════════════════════════════════════════

function getHuidigeWeek(){
  var now=new Date();
  var mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return mon.toISOString().substring(0,10);
}

function getOfMaakWeek(weekKey){
  var k=getKlas();
  if(!k.weekplannerWeken) k.weekplannerWeken=[];
  var week=k.weekplannerWeken.find(function(w){return w.weekKey===weekKey;});
  if(!week){
    week={weekKey,dagen:[
      {dag:'Maandag',activiteiten:[]},
      {dag:'Dinsdag',activiteiten:[]},
      {dag:'Woensdag',activiteiten:[]},
      {dag:'Donderdag',activiteiten:[]},
      {dag:'Vrijdag',activiteiten:[]},
    ]};
    k.weekplannerWeken.push(week);
  }
  return week;
}

function renderWeekplannerPanel(){
  var k=getKlas();
  if(!k.weekplannerWeken) k.weekplannerWeken=[];
  var p=document.getElementById('panel-weekplanner');
  // Week navigation
  var huidig=getHuidigeWeek();
  if(!window._wpWeek) window._wpWeek=huidig;
  var week=getOfMaakWeek(window._wpWeek);
  var weekDt=new Date(window._wpWeek+'T00:00:00');
  var weekEnd=new Date(weekDt);weekEnd.setDate(weekDt.getDate()+4);
  var fmt=function(d){return d.getDate()+'/'+(d.getMonth()+1);};
  var html='<div class="stitle">Weekplanner – '+k.naam+'</div>';
  html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">';
  html+='<button class="btn btn-ghost btn-sm" onclick="wpNavWeek(-1)">← Vorige week</button>';
  html+='<strong style="font-size:.88rem">Week van '+fmt(weekDt)+' t/m '+fmt(weekEnd)+'</strong>';
  html+='<button class="btn btn-ghost btn-sm" onclick="wpNavWeek(1)">Volgende week →</button>';
  if(window._wpWeek!==huidig) html+='<button class="btn btn-ghost btn-sm" onclick="wpGoHeden()">Vandaag</button>';
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">';
  week.dagen.forEach(function(dag,di){
    var dagClr=WP_DAGKLEUREN[di];
    html+='<div style="background:var(--surface);border:2px solid '+dagClr+'44;border-radius:var(--radius);overflow:hidden">';

function saveWpActiviteit(weekKey,dagIdx,actIdx){
  var naam=document.getElementById('wp-act-naam').value.trim();
  if(!naam){toast('Naam vereist');return;}
  var k=getKlas();
  var week=getOfMaakWeek(weekKey);
  var dag=week.dagen[dagIdx];
  var tag=document.getElementById('wp-act-tag').value;
  var tijdslot=document.getElementById('wp-act-tijdslot').value.trim();
  var wtId=document.getElementById('wp-act-wt').value||null;
  var llRaw=document.getElementById('wp-act-ll').value;
  var leerlijnen=llRaw?llRaw.split(',').map(function(s){return s.trim();}).filter(Boolean):[];
  var opmerking=document.getElementById('wp-act-opmerking').value.trim();
  var newAct={id:'wa'+uid(),naam,tag,tijdslot,werkplaatsTaakId:wtId,leerlijnen,opmerking,aangemaakt:Date.now()};
  if(actIdx!==null&&actIdx!==undefined){dag.activiteiten[actIdx]=Object.assign({},dag.activiteiten[actIdx],newAct);}
  else{dag.activiteiten.push(newAct);}
  save();closeModal();renderWeekplannerPanel();toast('Activiteit opgeslagen');
}

function deleteWpActiviteit(weekKey,dagIdx,actIdx){
  var week=getOfMaakWeek(weekKey);
  week.dagen[dagIdx].activiteiten.splice(actIdx,1);
  save();renderWeekplannerPanel();toast('Activiteit verwijderd');
}

// OBSERVATIE EXPORT BRIDGE
// Exporteert leerling-voortgang als JSON voor extern observatiesysteem
// AVG: namen worden gehasht als geanonimiseerd=true
// ══════════════════════════════════════════════════════════
function exportObservatieData(geanonimiseerd){
  var k=getKlas();
  var taken=k.werkplaatsTaken||[];
  var weken=k.weekplannerWeken||[];
  var data={
    exportDatum: new Date().toISOString(),
    klasNaam: geanonimiseerd?'[KLAS]':k.naam,
    versie:'1.0',
    leerlingen: k.leerlingen.map(function(l,idx){
      var naam=geanonimiseerd?'Leerling_'+(idx+1):l.naam;
      var werkplaatsVoortgang=taken.map(function(t){
        var v=(t.voortgang||[]).find(function(x){return x.leerlingId===l.id;})||{};
        return {
          taakNaam:t.naam,
          taakId:t.id,
          leerlijnen:t.leerlijnen||[],
          status:v.status||'open',
          dag:v.dag!==null&&v.dag!==undefined?WP_DAGNAMEN[v.dag]:null,
        };
      });
      return {
        id:geanonimiseerd?'ll_'+(idx+1):l.id,
        naam:naam,
        aanwezig:(l.status||'aanwezig')==='aanwezig',
        werkplaatsVoortgang:werkplaatsVoortgang,
        voortgangPct:getWerkplaatsVoortgangPct(l.id),
        groepjes:(k.groepjes||[]).filter(function(g){return g.leerlingIds.includes(l.id);}).map(function(g){return g.naam;}),
      };
    }),
    weekplanner: weken.map(function(w){
      return {
        weekKey:w.weekKey,
        dagen:w.dagen.map(function(d){
          return {
            dag:d.dag,
            activiteiten:d.activiteiten.map(function(a){
              return {naam:a.naam,tag:a.tag,tijdslot:a.tijdslot||null,leerlijnen:a.leerlijnen||[],opmerking:a.opmerking||null,werkplaatsTaakId:a.werkplaatsTaakId||null};
            })
          };
        })
      };
    }),
    werkplaatsTaken: taken.map(function(t){
      return {id:t.id,naam:t.naam,leerlijnen:t.leerlijnen||[],omschrijving:t.omschrijving||''};
    }),
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=(geanonimiseerd?'observatie-anoniem':'observatie-'+k.naam.replace(/\s+/g,'_'))+'-'+new Date().toISOString().substring(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Export gedownload ('+(geanonimiseerd?'geanonimiseerd':'met namen')+')');
}

function wpAddGroepje(sel){
  var hid=sel.dataset.hid;var di=parseInt(sel.dataset.di);var gid=sel.value;
  if(!gid) return; sel.value='';
  var k=getKlas();var b=getActiveBord();
  if(!b.werkplaatsSlots) b.werkplaatsSlots={};
  if(!b.werkplaatsSlots[hid]) b.werkplaatsSlots[hid]={};
  if(!b.werkplaatsSlots[hid][di]) b.werkplaatsSlots[hid][di]=[];
  var g=k.groepjes.find(function(x){return x.id===gid;});if(!g) return;
  var cur=b.werkplaatsSlots[hid][di];
  g.leerlingIds.forEach(function(lid){if(!cur.includes(lid)) cur.push(lid);});
  save();
  var cont=document.getElementById('wpslot-'+hid+'-'+di);if(!cont) return;
  cont.innerHTML='';
  cur.forEach(function(lid){
    var ll=k.leerlingen.find(function(x){return x.id===lid;});if(!ll) return;
    var sp=document.createElement('span');
    sp.style.cssText='display:inline-flex;align-items:center;gap:2px;background:'+ll.kleur+'22;border:1px solid '+ll.kleur+';border-radius:10px;padding:1px 5px;font-size:.66rem;font-weight:600';
    sp.textContent=ll.naam;
    var rm=document.createElement('button');
    rm.style.cssText='background:none;border:none;cursor:pointer;color:var(--danger);font-size:.6rem;padding:0 1px';
    rm.textContent='✕';
    rm.onclick=(function(h,d,l){return function(){wpRemoveLidDirect(h,d,l);};})(hid,di,lid);
    sp.appendChild(rm);cont.appendChild(sp);
  });
}

function wpRemoveLid(btn){
  wpRemoveLidDirect(btn.dataset.hid,parseInt(btn.dataset.di),btn.dataset.lid);
  btn.closest('span').remove();
}
function wpRemoveLidDirect(hid,di,lid){
  var b=getActiveBord();
  if(b.werkplaatsSlots&&b.werkplaatsSlots[hid]&&b.werkplaatsSlots[hid][di]){
    b.werkplaatsSlots[hid][di]=b.werkplaatsSlots[hid][di].filter(function(x){return x!==lid;});
    save();
  }
}

function openPin(cb,title,sub){
  _pi='';pinCallback=cb;

function pinPress(val){
  if(val==='cancel'){document.getElementById('pin-overlay').classList.remove('active');pinCallback=null;_pi='';return;}
  if(val==='back') _pi=_pi.slice(0,-1);
  else{if(_pi.length>=4) return;_pi+=val;}
  const dots=_pi.split('').map(()=>'●').join(' ');const blanks=Array(4-_pi.length).fill('_').join(' ');
  document.getElementById('pin-display').textContent=(dots+(dots&&blanks?' ':'')+blanks)||'_ _ _ _';
  if(_pi.length===4){
    if(_pi===(getSettings().pinCode||DEF_PIN)){
      document.getElementById('pin-overlay').classList.remove('active');_pi='';
      if(pinCallback){pinCallback();pinCallback=null;}
    } else {
      document.getElementById('pin-error').textContent='Onjuiste PIN';
      setTimeout(()=>{_pi='';document.getElementById('pin-display').textContent='_ _ _ _';document.getElementById('pin-error').textContent='';},1000);
    }
  }
}

function initGroep1D(){

  k.thema='groen';
  // Leerlingen
  var colors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63',
    '#ff5722','#00bcd4','#8bc34a','#ff9800','#673ab7','#f44336','#2196f3','#4caf50','#ff5252',
    '#7c4dff','#64dd17','#00e5ff','#ffd740','#ff6d00','#69f0ae','#40c4ff','#ea80fc','#b9f6ca','#80d8ff'];
  GROEP_1D_LL.forEach(function(ll,i){
    var l={id:'ll-1d-'+i,naam:ll.naam,kleur:colors[i%colors.length],image:ll.img,_c:true,status:'aanwezig',lid:true};
    k.leerlingen.push(l);
  });
  // Hoeken
  var hoekNames=['Bouwhoek','Huishoek','Zandtafel','Knutselhoek','Werktafel','Leeshoek','Knutselkast'];
  hoekNames.forEach(function(naam,i){
    var fId='foto-1d-'+i;
    var hId='hoek-1d-'+i;
    var fotoEntry=HOEK_FOTOS.find(function(x){return x.naam===naam;});
    if(fotoEntry){k.fotoLib.push({id:fId,naam:naam,data:fotoEntry.data,_c:true});}
    k.hoekLib.push({id:hId,naam:naam,maxKinderen:4,fotoId:fId,domein:'',doelIds:[]});
  });
  k.borden[0].hoekLibIds=k.hoekLib.map(function(h){return h.id;});
  k.hoekLib.forEach(function(h){k.borden[0].plaatsingen[h.id]=[];});
  G.klassen.push(k);
  save();
}

function toggleFullscreen(){
  const btn=document.getElementById('fs-btn');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const el=document.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen).call(el).catch(()=>{});
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document).catch(()=>{});
  }
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const btn=document.getElementById('fs-btn');
  if(btn) btn.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'✕':'⛶';
}));

// FOTOKLUIS
// De picto's van kinderen staan NIET in deze code en dus ook niet in de
// repository. Ze leven in IndexedDB op dit apparaat en komen binnen via
// een kluisbestand. Dat bestand kan met een wachtwoord versleuteld worden
// (AES-GCM 256 + PBKDF2), zodat het veilig mag rondreizen.
// Zonder foto's toont de app een gekleurde cirkel met de beginletter.
// ══════════════════════════════════════════════════════════
var FK_DB='kb_fotokluis', FK_STORE='fotos', FK_KEY='alles';
var fotokluis={beschikbaar:true,aantal:0,reden:''};

function fkOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('deze browser biedt geen opslag'));return;}
    var req;
    try{req=indexedDB.open(FK_DB,1);}catch(e){rej(e);return;}
    req.onupgradeneeded=function(){req.result.createObjectStore(FK_STORE);};
    req.onsuccess=function(){res(req.result);};
    req.onerror=function(){rej(req.error||new Error('opslag niet beschikbaar'));};
    req.onblocked=function(){rej(new Error('opslag geblokkeerd door een ander tabblad'));};
  });
}
function fkTx(modus,fn){
  return fkOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(FK_STORE,modus);
      var req=fn(tx.objectStore(FK_STORE));
      req.onsuccess=function(){res(req.result);};
      req.onerror=function(){rej(req.error);};
    });
  });
}
function fkLees(){return fkTx('readonly',function(s){return s.get(FK_KEY);});}
function fkBewaar(map){return fkTx('readwrite',function(s){return s.put(map,FK_KEY);});}
function fkWis(){return fkTx('readwrite',function(s){return s.delete(FK_KEY);});}

function fkPasToe(map){
  if(!map) return 0;
  var n=0;
  HOEK_FOTOS.forEach(function(f){var d=map['hoek/'+f.naam];if(d){f.data=d;n++;}});
  GROEP_1C_LL.forEach(function(l){var d=map['1c/'+l.naam];if(d){l.img=d;n++;}});
  GROEP_1D_LL.forEach(function(l){var d=map['1d/'+l.naam];if(d){l.img=d;n++;}});
  return n;
}
function fkLaad(){
  return fkLees().then(function(map){
    fotokluis.aantal=fkPasToe(map);
    return fotokluis.aantal;
  }).catch(function(e){
    fotokluis.beschikbaar=false;
    fotokluis.reden=(e&&e.message)?e.message:'onbekend';
    return 0;
  });
}

// ── versleuteling ──
function fkCryptoKan(){return !!(window.crypto&&window.crypto.subtle&&window.isSecureContext);}
function fkB64van(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function fkB64naar(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function fkSleutel(ww,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(ww),'PBKDF2',false,['deriveKey'])
    .then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    });
}
function fkVersleutel(tekst,ww){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return fkSleutel(ww,salt).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(tekst));
  }).then(function(ct){
    return {formaat:'keuzebord-fotokluis',versie:1,versleuteld:true,
      algoritme:'AES-GCM-256 / PBKDF2-SHA256-250000',
      salt:fkB64van(salt),iv:fkB64van(iv),data:fkB64van(ct)};
  });
}
function fkOntsleutel(pak,ww){
  return fkSleutel(ww,fkB64naar(pak.salt)).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:fkB64naar(pak.iv)},key,fkB64naar(pak.data));
  }).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}

// ── importeren ──
function fkImporteer(input){
  var file=input.files&&input.files[0];
  input.value='';
  if(!file) return;
  var r=new FileReader();
  r.onload=function(e){
    var pak;
    try{pak=JSON.parse(e.target.result);}catch(err){toast('Dit is geen geldig kluisbestand');return;}
    if(!pak||pak.formaat!=='keuzebord-fotokluis'){toast('Dit is geen fotokluis-bestand');return;}
    if(pak.versleuteld){
      if(!fkCryptoKan()){toast('Versleutelde bestanden vragen een https-adres');return;}
      fkVraagWachtwoord('Wachtwoord van het kluisbestand',function(ww){
        if(!ww){toast('Geen wachtwoord ingevuld');return;}
        fkOntsleutel(pak,ww)
          .then(function(open){fkOpslaan((open&&open.fotos)||open);})
          .catch(function(){toast('Wachtwoord klopt niet, of het bestand is beschadigd');});
      });
    } else {
      fkOpslaan(pak.fotos||{});
    }
  };
  r.onerror=function(){toast('Bestand kon niet gelezen worden');};
  r.readAsText(file);
}
function fkOpslaan(map){
  var n=Object.keys(map||{}).length;
  if(!n){toast('Het bestand bevat geen foto\'s');return;}
  fkBewaar(map).then(function(){
    fotokluis.beschikbaar=true;
    fotokluis.aantal=fkPasToe(map);
    reattachRuntimeImages();
    renderFotosPanel();
    toast(n+' foto\'s op dit apparaat gezet');
  }).catch(function(e){toast('Opslaan mislukt: '+((e&&e.message)||'onbekend'));});
}
function fkVraagWachtwoord(titel,cb){
  openModal(titel,
    '<div class="fg"><label>Wachtwoord</label><input type="password" id="fk-ww-in" autocomplete="current-password"></div>',
    [{label:'Annuleer',cls:'btn-ghost',action:closeModal},
     {label:'Openen',cls:'btn-primary',action:function(){
       var v=(document.getElementById('fk-ww-in')||{}).value||'';
       closeModal();cb(v);
     }}]);
  setTimeout(function(){var i=document.getElementById('fk-ww-in');if(i)i.focus();},60);
}

// ── exporteren ──
function fkExporteer(){
  fkLees().then(function(map){
    if(!map||!Object.keys(map).length){toast('Er staan geen foto\'s op dit apparaat');return;}
    var n=Object.keys(map).length;
    openModal('Fotokluis exporteren',
      '<p style="font-size:.85rem;margin-bottom:12px">'+n+' foto\'s. Geef een wachtwoord op als het bestand dit apparaat verlaat — op een USB-stick, in de mail of in een schoolomgeving.</p>'+
      '<div class="fg"><label>Wachtwoord (leeg = onversleuteld)</label><input type="password" id="fk-ww" autocomplete="new-password"></div>'+
      '<p class="hint">Kwijt is kwijt: zonder wachtwoord is een versleuteld bestand niet meer te openen.</p>',
      [{label:'Annuleer',cls:'btn-ghost',action:closeModal},
       {label:'Downloaden',cls:'btn-primary',action:function(){fkDownload(map);}}]);
  }).catch(function(){toast('Fotokluis niet beschikbaar op dit apparaat');});
}
function fkDownload(map){
  var ww=(document.getElementById('fk-ww')||{}).value||'';
  var klaar=function(pak){
    var blob=new Blob([JSON.stringify(pak)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='keuzebord-fotokluis'+(ww?'-versleuteld':'')+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    closeModal();toast('Bestand gedownload');
  };
  if(!ww){klaar({formaat:'keuzebord-fotokluis',versie:1,versleuteld:false,
    aantal:Object.keys(map).length,fotos:map});return;}
  if(!fkCryptoKan()){toast('Versleutelen kan alleen via een https-adres');return;}
  fkVersleutel(JSON.stringify({fotos:map}),ww).then(klaar)
    .catch(function(){toast('Versleutelen mislukt');});
}

// ── wissen ──
function fkLeegmaken(){
  openModal('Foto\'s van dit apparaat wissen?',
    '<p style="font-size:.85rem">De foto\'s verdwijnen alleen van dít apparaat. Kinderen krijgen weer een gekleurde cirkel met hun beginletter. Zorg dat je eerst een kluisbestand hebt gedownload.</p>',
    [{label:'Annuleer',cls:'btn-ghost',action:closeModal},
     {label:'Wissen',cls:'btn-danger',action:function(){
       fkWis().then(function(){
         fotokluis.aantal=0;
         HOEK_FOTOS.forEach(function(f){f.data=null;});
         GROEP_1C_LL.forEach(function(l){l.img=null;});
         GROEP_1D_LL.forEach(function(l){l.img=null;});
         G.klassen.forEach(function(k){
           k.leerlingen.forEach(function(l){if(l._c)l.image=null;});
           (k.fotoLib||[]).forEach(function(f){if(f._c)f.data=null;});
         });
         closeModal();renderFotosPanel();toast('Foto\'s gewist van dit apparaat');
       }).catch(function(){closeModal();toast('Wissen mislukt');});
     }}]);
}

  // Migratie: verwijder plaatsingen van niet-bestaande of lid=false leerlingen
  b.plaatsingen[h.id]=b.plaatsingen[h.id].filter(p=>k.leerlingen.find(l=>l.id===p.leerlingId&&l.lid!==false));
})));
(function start(){
  // Foto's staan op dit apparaat, niet in de code. Laden vóór de eerste render,
  // zodat de picto's meteen goed staan. Lukt het niet, dan draait de app door
  // met gekleurde cirkels en de beginletter van elk kind.
  doelenLaad();
  fkLaad().then(function(){
    initGroep1D();
    initGroep1C();
    reattachRuntimeImages();
    renderKlasSelect();
    var _ab=getActiveBord();
    if(_ab.dagOpen){showScreen('board');renderBoard();}
    else if(_ab.dagGesloten){showScreen('closed');document.getElementById('closed-sum').textContent='Dag afgesloten.';}
    else{showScreen('klasselect');renderKlasSelect();}
  });
})();
